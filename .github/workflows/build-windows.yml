name: Build Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Prepare installer
        shell: pwsh
        run: |
          $dir = "src-tauri\target\release\bundle\nsis"
          $exe = Get-ChildItem -Path "$dir\*x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "NSIS installer not found"; exit 1 }
          $version = node -p "require('./package.json').version"
          $newName = "YouXu_${version}_x64-setup.exe"
          Rename-Item -Path $exe.FullName -NewName $newName
          $final = Join-Path $dir $newName
          (Get-FileHash -Path $final -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii "$final.sha256"
          Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name }

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 邮序 ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          prerelease: true
          generate_release_notes: false
          body: |
            未签名的 Windows 安装包（.exe），仅供内部测试。
            首次运行若出现 SmartScreen 提示，请点击「更多信息」→「仍要运行」。
            说明：Windows 版邮件读取、分类、写信与回复、教授邮箱查询、iSpace DDL 同步和本机定时提醒均可用；无需 Microsoft Entra 或管理员权限。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
