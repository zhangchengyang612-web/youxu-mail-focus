<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>邮序 · BNBU 学生邮件助手</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (location.protocol === "file:") {
        document.getElementById("root").innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;background:#f4f6f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#183d32;padding:24px">
            <section style="width:min(520px,100%);background:white;border:1px solid #e0e6df;border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(24,61,50,.10)">
              <div style="font-size:34px;margin-bottom:16px">✦</div>
              <h1 style="font-size:24px;margin:0 0 10px">请通过开发服务打开邮序</h1>
              <p style="color:#66746d;line-height:1.7;margin:0 0 20px">这个文件是应用源码入口，不能直接双击运行。请在项目目录执行：</p>
              <pre style="background:#183d32;color:#d1f265;border-radius:10px;padding:14px;overflow:auto">npm run dev</pre>
              <p style="color:#66746d;font-size:13px;margin:18px 0 0">然后访问 <strong>http://127.0.0.1:1420/</strong></p>
            </section>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
